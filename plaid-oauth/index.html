<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnowKeep — Bank Linking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #380000;
      color: #f3ce66;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .snowflake {
      font-size: 40px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Spectral', serif;
      font-size: 28px;
      font-weight: 500;
      color: #f3ce66;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      color: #f3ce66;
      line-height: 1.6;
      opacity: 0.85;
      max-width: 420px;
      margin-bottom: 28px;
    }

    button {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #380000;
      background: #f3ce66;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="snowflake">❄</div>
  <h1>Bank linking in progress</h1>
  <p>
    You can close this page and return to the SnowKeep app to finish
    linking your account.
  </p>
  <button type="button" onclick="window.close()">Close</button>
</body>
</html>
